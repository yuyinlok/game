<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scatter — Human Jigsaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12111a;
    --paper:#1c1b28;
    --paper-raised:#252436;
    --line: rgba(245,244,255,0.10);
    --text:#f4f3fb;
    --text-dim:#a6a3bd;
    --amber:#ffb238;
    --teal:#37e0c4;
    --coral:#ff6b5e;
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(255,178,56,0.10), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(55,224,196,0.10), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3, .display{ font-family:'Space Grotesk', sans-serif; }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 20px 40px;
    width:100%;
    max-width:560px;
    margin:0 auto;
  }
  .wordmark{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:36px;
  }
  .wordmark .piece{
    width:26px;height:26px;border-radius:7px;
    background: linear-gradient(135deg, var(--amber), var(--coral));
    transform: rotate(-8deg);
    flex-shrink:0;
  }
  .wordmark span{ font-size:22px; font-weight:600; letter-spacing:-0.02em; color:var(--text-dim);}
  .hero-title{
    font-size:44px;
    font-weight:700;
    line-height:1.05;
    letter-spacing:-0.02em;
    margin:0 0 12px;
    text-align:center;
  }
  .hero-sub{
    color:var(--text-dim);
    font-size:16px;
    line-height:1.5;
    text-align:center;
    max-width:400px;
    margin:0 0 40px;
  }
  .stack{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:100%;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    outline:none;
  }
  .btn{
    padding:18px 22px;
    border-radius:14px;
    font-size:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{
    background: linear-gradient(135deg, var(--amber), var(--coral));
    color:#1a1408;
  }
  .btn-secondary{
    background: var(--paper-raised);
    color: var(--text);
    border:1px solid var(--line);
  }
  .btn-ghost{
    background:transparent;
    color: var(--text-dim);
    border:1px solid var(--line);
  }
  .btn-teal{
    background: var(--teal);
    color:#04261f;
  }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .card{
    background: var(--paper);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    width:100%;
  }
  .field-label{
    font-size:13px;
    color:var(--text-dim);
    margin: 22px 0 10px;
    font-weight:500;
  }
  .field-label:first-child{ margin-top:0; }
  input[type=text]{
    width:100%;
    background: var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    font-size:17px;
    color:var(--text);
    font-family:inherit;
  }
  input[type=text]:focus{ border-color: var(--teal); }
  input.code-input{
    text-transform:uppercase;
    letter-spacing:0.3em;
    text-align:center;
    font-size:26px;
    font-weight:600;
    font-family:'Space Grotesk', sans-serif;
  }
  .img-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
  }
  .img-option{
    position:relative;
    aspect-ratio:1;
    border-radius:12px;
    overflow:hidden;
    border:2px solid transparent;
    background-size:cover;
    background-position:center;
  }
  .img-option.selected{ border-color: var(--amber); }
  .img-option.selected::after{
    content:"✓";
    position:absolute; top:6px; right:6px;
    width:22px; height:22px;
    background:var(--amber);
    color:#1a1408;
    border-radius:50%;
    font-size:13px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .size-row{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
  }
  .size-opt{
    padding:16px 8px;
    border-radius:12px;
    background:var(--paper-raised);
    border:2px solid transparent;
    text-align:center;
  }
  .size-opt.selected{ border-color: var(--teal); }
  .size-opt .n{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; }
  .size-opt .l{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .err{
    background: rgba(255,107,94,0.12);
    border:1px solid rgba(255,107,94,0.35);
    color: #ffb4ac;
    padding:14px 16px;
    border-radius:12px;
    font-size:14px;
    margin-top:14px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    line-height:1.4;
  }
  .code-display{
    font-family:'Space Grotesk', sans-serif;
    font-size:56px;
    font-weight:700;
    letter-spacing:0.12em;
    text-align:center;
    margin: 6px 0 4px;
    background: linear-gradient(135deg, var(--amber), var(--coral));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color: transparent;
  }
  .code-hint{ text-align:center; color:var(--text-dim); font-size:14px; margin-bottom:28px; }
  .lobby-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .lobby-title{ font-size:14px; color:var(--text-dim); font-weight:500; }
  .piece-count{ font-size:13px; color:var(--teal); font-weight:600; }
  .player-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(90px,1fr));
    gap:10px;
    margin: 14px 0 4px;
  }
  .player-chip{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 8px;
    text-align:center;
  }
  .player-chip .num{
    width:26px;height:26px;
    border-radius:50%;
    background: var(--teal);
    color:#04261f;
    font-size:12px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 6px;
  }
  .player-chip .nm{ font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .slot-empty{
    border:1px dashed var(--line);
    border-radius:12px;
    padding:12px 8px;
    text-align:center;
    color: var(--text-dim);
    font-size:12px;
  }
  .preview-wrap{
    margin-top:22px;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .preview-img{
    width:100%; aspect-ratio:1;
    background-size:cover; background-position:center;
    display:block;
    position:relative;
  }
  .grid-overlay{
    position:absolute; inset:0;
    display:grid;
  }
  .grid-cell{
    border:1px solid rgba(0,0,0,0.35);
    display:flex; align-items:flex-end; justify-content:flex-start;
  }
  .grid-cell.claimed{ background: rgba(55,224,196,0.22); }
  .grid-cell .tag{
    background: rgba(18,17,26,0.8);
    color:#fff;
    font-size:10px;
    padding:2px 5px;
    margin:3px;
    border-radius:4px;
    max-width:calc(100% - 6px);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .foot-actions{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }
  .waiting-pulse{
    width:14px;height:14px;border-radius:50%;
    background:var(--teal);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(0.75);}
  }
  .waiting-row{ display:flex; align-items:center; gap:10px; justify-content:center; margin-top:6px;}
  .piece-full{
    position:fixed; inset:0;
    display:flex;
    flex-direction:column;
  }
  .piece-canvas{
    flex:1;
    background-repeat:no-repeat;
    position:relative;
  }
  .piece-hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding: 16px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  }
  .hud-chip{
    background: rgba(18,17,26,0.75);
    backdrop-filter: blur(6px);
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .hud-num{
    width:20px;height:20px;border-radius:50%;
    background:var(--amber); color:#1a1408;
    font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .peek-btn{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background: rgba(18,17,26,0.85);
    backdrop-filter: blur(6px);
    color:#fff;
    padding:14px 22px;
    border-radius:30px;
    font-size:14px;
    font-weight:600;
    border:1px solid rgba(255,255,255,0.15);
    display:flex; align-items:center; gap:8px;
    z-index:20;
  }
  .peek-overlay{
    position:fixed; inset:0;
    background: rgba(10,10,15,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px; gap:18px;
    z-index:30;
  }
  .peek-img{
    width:min(80vw,340px); aspect-ratio:1;
    background-size:cover; background-position:center;
    border-radius:14px;
    border:1px solid var(--line);
  }
  .back-link{
    position:fixed; top:18px; left:18px;
    color: var(--text-dim);
    font-size:14px;
    display:flex; align-items:center; gap:6px;
    z-index:5;
    background:none; border:none;
  }
  .small-note{ font-size:12px; color:var(--text-dim); text-align:center; margin-top:16px; line-height:1.5;}
  .center-note{ text-align:center; color:var(--text-dim); font-size:15px; line-height:1.6; }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){

  const PRESET_IMAGES = [
    { id:'mountain', label:'Mountains', url:'https://picsum.photos/seed/scatter-mountain/900/900' },
    { id:'ocean', label:'Ocean', url:'https://picsum.photos/seed/scatter-ocean/900/900' },
    { id:'forest', label:'Forest', url:'https://picsum.photos/seed/scatter-forest/900/900' },
    { id:'city', label:'City', url:'https://picsum.photos/seed/scatter-city/900/900' },
    { id:'space', label:'Space', url:'https://picsum.photos/seed/scatter-space/900/900' },
    { id:'flowers', label:'Flowers', url:'https://picsum.photos/seed/scatter-flowers/900/900' },
  ];
  const SIZE_OPTIONS = [
    { rows:2, cols:2, label:'4 players' },
    { rows:3, cols:3, label:'9 players' },
    { rows:4, cols:4, label:'16 players' },
  ];
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no O/I/0/1 confusion

  let state = {
    view: 'home',            // home | hostSetup | hostLobby | hostGame | join | waiting | playing
    room: null,              // full room object
    roomCode: null,
    playerId: null,
    playerName: '',
    selectedImage: PRESET_IMAGES[0],
    selectedSize: SIZE_OPTIONS[1],
    joinCodeInput: '',
    joinNameInput: '',
    error: null,
    busy: false,
    showPeek: false,
  };

  let pollTimer = null;

  function render(){
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(Views[state.view]());
  }

  function el(tag, attrs={}, children=[]){
    const e = document.createElement(tag);
    for(const k in attrs){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'text') e.textContent = attrs[k];
      else if(k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c === null || c === undefined) return;
      if(typeof c === 'string') e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }

  function wordmark(){
    return el('div',{class:'wordmark'},[
      el('div',{class:'piece'}),
      el('span',{text:'Scatter'})
    ]);
  }

  function backLink(onClick){
    return el('button',{class:'back-link', onclick:onClick},[ '← Back' ]);
  }

  function roomKey(code){ return `puzzle-room:${code}`; }

  async function saveRoom(room){
    room.updatedAt = Date.now();
    await window.storage.set(roomKey(room.code), JSON.stringify(room), true);
  }

  async function loadRoom(code){
    try{
      const res = await window.storage.get(roomKey(code), true);
      if(!res) return null;
      return JSON.parse(res.value);
    }catch(e){
      return null;
    }
  }

  function genCode(){
    let c = '';
    for(let i=0;i<4;i++) c += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
    return c;
  }

  function stopPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }

  function startPolling(fn, ms){
    stopPolling();
    pollTimer = setInterval(fn, ms);
  }

  // ---------- VIEWS ----------

  const Views = {

    home(){
      const wrap = el('div',{class:'screen'});
      wrap.appendChild(wordmark());
      wrap.appendChild(el('h1',{class:'hero-title', text:'Turn your phones into one big puzzle.'}));
      wrap.appendChild(el('p',{class:'hero-sub', text:'One picture, split across every screen. Line up the devices to bring it together.'}));
      const stack = el('div',{class:'stack'});
      stack.appendChild(el('button',{class:'btn btn-primary', onclick:()=>{
        state.view='hostSetup'; state.error=null; render();
      }}, ['🧩 Host a game']));
      stack.appendChild(el('button',{class:'btn btn-secondary', onclick:()=>{
        state.view='join'; state.error=null; render();
      }}, ['📱 Join a game']));
      wrap.appendChild(stack);
      wrap.appendChild(el('p',{class:'small-note', text:'Everyone needs their own phone or tablet. Works best with 4 or more people in the same room.'}));
      return wrap;
    },

    hostSetup(){
      const wrap = el('div',{class:'screen'});
      wrap.appendChild(backLink(()=>{ state.view='home'; render(); }));
      wrap.appendChild(wordmark());
      wrap.appendChild(el('h1',{class:'hero-title', text:'Set up the puzzle'}));
      const card = el('div',{class:'card'});

      card.appendChild(el('div',{class:'field-label', text:'Choose a picture'}));
      const grid = el('div',{class:'img-grid'});
      PRESET_IMAGES.forEach(img=>{
        const opt = el('div',{
          class:'img-option' + (state.selectedImage.id===img.id?' selected':''),
          style:`background-image:url(${img.url})`,
          onclick:()=>{ state.selectedImage = img; render(); }
        });
        grid.appendChild(opt);
      });
      card.appendChild(grid);

      card.appendChild(el('div',{class:'field-label', text:'How many players?'}));
      const sizeRow = el('div',{class:'size-row'});
      SIZE_OPTIONS.forEach(sz=>{
        const opt = el('div',{
          class:'size-opt' + (state.selectedSize.rows===sz.rows?' selected':''),
          onclick:()=>{ state.selectedSize = sz; render(); }
        },[
          el('div',{class:'n', text:`${sz.rows}×${sz.cols}`}),
          el('div',{class:'l', text:sz.label}),
        ]);
        sizeRow.appendChild(opt);
      });
      card.appendChild(sizeRow);

      wrap.appendChild(card);

      if(state.error){
        wrap.appendChild(el('div',{class:'err'},[ '⚠️ ' + state.error ]));
      }

      const foot = el('div',{class:'foot-actions'});
      const createBtn = el('button',{class:'btn btn-primary', onclick: handleCreateRoom},[
        state.busy ? 'Creating room…' : 'Create room'
      ]);
      if(state.busy) createBtn.setAttribute('disabled','true');
      foot.appendChild(createBtn);
      wrap.appendChild(foot);

      return wrap;
    },

    hostLobby(){
      const wrap = el('div',{class:'screen'});
      wrap.appendChild(el('div',{class:'lobby-title', text:'ROOM CODE — SHARE WITH PLAYERS'}));
      wrap.appendChild(el('div',{class:'code-display', text: state.roomCode}));
      wrap.appendChild(el('div',{class:'code-hint', text:'Players join at this app and enter this code.'}));

      const room = state.room;
      const total = room.rows * room.cols;
      const joined = room.players.length;

      const card = el('div',{class:'card'});
      const lh = el('div',{class:'lobby-header'},[
        el('div',{class:'lobby-title', text:'PLAYERS'}),
        el('div',{class:'piece-count', text:`${joined} / ${total} pieces claimed`}),
      ]);
      card.appendChild(lh);

      const pg = el('div',{class:'player-grid'});
      for(let i=0;i<total;i++){
        const p = room.players.find(p=>p.pieceIndex===i);
        if(p){
          pg.appendChild(el('div',{class:'player-chip'},[
            el('div',{class:'num', text:String(i+1)}),
            el('div',{class:'nm', text:p.name}),
          ]));
        } else {
          pg.appendChild(el('div',{class:'slot-empty'},[ `Piece ${i+1}`, el('br'), 'waiting…' ]));
        }
      }
      card.appendChild(pg);
      wrap.appendChild(card);

      const previewWrap = el('div',{class:'preview-wrap'});
      const previewImg = el('div',{class:'preview-img', style:`background-image:url(${room.imageUrl})`});
      const overlay = el('div',{class:'grid-overlay', style:`grid-template-columns:repeat(${room.cols},1fr); grid-template-rows:repeat(${room.rows},1fr);`});
      for(let i=0;i<total;i++){
        const p = room.players.find(p=>p.pieceIndex===i);
        const cell = el('div',{class:'grid-cell' + (p?' claimed':'')});
        if(p) cell.appendChild(el('div',{class:'tag', text:p.name}));
        overlay.appendChild(cell);
      }
      previewImg.appendChild(overlay);
      previewWrap.appendChild(previewImg);
      wrap.appendChild(previewWrap);

      if(state.error){
        wrap.appendChild(el('div',{class:'err'},[ '⚠️ ' + state.error ]));
      }

      const foot = el('div',{class:'foot-actions'});
      const startBtn = el('button',{class:'btn btn-primary', onclick: handleStartGame},[
        joined === 0 ? 'Waiting for players…' : `Start game (${joined} playing)`
      ]);
      if(joined===0) startBtn.setAttribute('disabled','true');
      foot.appendChild(startBtn);
      foot.appendChild(el('button',{class:'btn btn-ghost', onclick:()=>{
        stopPolling(); state.view='home'; state.room=null; state.roomCode=null; render();
      }}, ['Cancel this room']));
      wrap.appendChild(foot);

      return wrap;
    },

    hostGame(){
      const room = state.room;
      const total = room.rows * room.cols;
      const wrap = el('div',{class:'screen'});
      wrap.appendChild(el('div',{class:'lobby-title', text:'GAME IN PROGRESS'}));
      wrap.appendChild(el('h1',{class:'hero-title', style:'font-size:28px;', text:'Match the pieces!'}));
      wrap.appendChild(el('p',{class:'hero-sub', text:'Everyone is holding one piece. Have them line up their screens to rebuild the picture below.'}));

      const previewWrap = el('div',{class:'preview-wrap'});
      const previewImg = el('div',{class:'preview-img', style:`background-image:url(${room.imageUrl})`});
      const overlay = el('div',{class:'grid-overlay', style:`grid-template-columns:repeat(${room.cols},1fr); grid-template-rows:repeat(${room.rows},1fr);`});
      for(let i=0;i<total;i++){
        const p = room.players.find(p=>p.pieceIndex===i);
        const cell = el('div',{class:'grid-cell claimed'});
        if(p) cell.appendChild(el('div',{class:'tag', text:`${i+1} · ${p.name}`}));
        overlay.appendChild(cell);
      }
      previewImg.appendChild(overlay);
      previewWrap.appendChild(previewImg);
      wrap.appendChild(previewWrap);

      const foot = el('div',{class:'foot-actions'});
      foot.appendChild(el('button',{class:'btn btn-secondary', onclick:handleNewRound},[ '🔄 New puzzle' ]));
      foot.appendChild(el('button',{class:'btn btn-ghost', onclick:()=>{
        stopPolling(); state.view='home'; state.room=null; state.roomCode=null; render();
      }}, ['End game']));
      wrap.appendChild(foot);
      return wrap;
    },

    join(){
      const wrap = el('div',{class:'screen'});
      wrap.appendChild(backLink(()=>{ state.view='home'; state.error=null; render(); }));
      wrap.appendChild(wordmark());
      wrap.appendChild(el('h1',{class:'hero-title', text:'Join a game'}));
      const card = el('div',{class:'card'});

      card.appendChild(el('div',{class:'field-label', text:'Room code'}));
      const codeInput = el('input',{type:'text', class:'code-input', maxlength:'4', placeholder:'XXXX', value: state.joinCodeInput});
      codeInput.addEventListener('input', (e)=>{ state.joinCodeInput = e.target.value.toUpperCase(); });
      card.appendChild(codeInput);

      card.appendChild(el('div',{class:'field-label', text:'Your name'}));
      const nameInput = el('input',{type:'text', placeholder:'e.g. Sam', value: state.joinNameInput});
      nameInput.addEventListener('input', (e)=>{ state.joinNameInput = e.target.value; });
      card.appendChild(nameInput);

      wrap.appendChild(card);

      if(state.error){
        wrap.appendChild(el('div',{class:'err'},[ '⚠️ ' + state.error ]));
      }

      const foot = el('div',{class:'foot-actions'});
      const joinBtn = el('button',{class:'btn btn-primary', onclick: handleJoinRoom},[
        state.busy ? 'Joining…' : 'Join room'
      ]);
      if(state.busy) joinBtn.setAttribute('disabled','true');
      foot.appendChild(joinBtn);
      wrap.appendChild(foot);
      return wrap;
    },

    waiting(){
      const wrap = el('div',{class:'screen'});
      wrap.appendChild(wordmark());
      const room = state.room;
      const me = room.players.find(p=>p.id===state.playerId);
      wrap.appendChild(el('h1',{class:'hero-title', style:'font-size:30px;', text:`You're piece ${me ? me.pieceIndex+1 : '?'}`}));
      wrap.appendChild(el('p',{class:'center-note', text:`Hang tight — waiting for the host to start the game in room ${state.roomCode}.`}));
      wrap.appendChild(el('div',{class:'waiting-row'},[
        el('div',{class:'waiting-pulse'}),
        el('span',{style:'color:var(--text-dim); font-size:14px;', text:'Watching for host…'})
      ]));
      const foot = el('div',{class:'foot-actions', style:'margin-top:36px;'});
      foot.appendChild(el('button',{class:'btn btn-ghost', onclick:()=>{
        stopPolling(); state.view='home'; state.room=null; state.roomCode=null; render();
      }}, ['Leave room']));
      wrap.appendChild(foot);
      return wrap;
    },

    playing(){
      const room = state.room;
      const me = room.players.find(p=>p.id===state.playerId);
      const idx = me.pieceIndex;
      const row = Math.floor(idx / room.cols);
      const col = idx % room.cols;
      const bgSizeW = room.cols * 100;
      const bgSizeH = room.rows * 100;
      const posX = room.cols>1 ? (col * 100/(room.cols-1)) : 50;
      const posY = room.rows>1 ? (row * 100/(room.rows-1)) : 50;

      const wrap = el('div',{class:'piece-full'});
      const canvas = el('div',{
        class:'piece-canvas',
        style:`background-image:url(${room.imageUrl}); background-size:${bgSizeW}% ${bgSizeH}%; background-position:${posX}% ${posY}%;`
      });
      const hud = el('div',{class:'piece-hud'},[
        el('div',{class:'hud-chip'},[
          el('div',{class:'hud-num', text:String(idx+1)}),
          el('span',{text: me.name}),
        ]),
        el('button',{class:'hud-chip', style:'background:rgba(18,17,26,0.75); color:#fff;', onclick:()=>{
          stopPolling(); state.view='home'; state.room=null; state.roomCode=null; render();
        }},[ 'Leave' ])
      ]);
      canvas.appendChild(hud);
      wrap.appendChild(canvas);

      wrap.appendChild(el('button',{class:'peek-btn', onclick:()=>{ state.showPeek=true; render(); }},[ '👁 Peek at full picture' ]));

      if(state.showPeek){
        const overlay = el('div',{class:'peek-overlay', onclick:()=>{ state.showPeek=false; render(); }});
        overlay.appendChild(el('div',{class:'peek-img', style:`background-image:url(${room.imageUrl})`}));
        overlay.appendChild(el('div',{style:'color:var(--text-dim); font-size:13px;', text:'Tap anywhere to close'}));
        wrap.appendChild(overlay);
      }
      return wrap;
    },
  };

  // ---------- ACTIONS ----------

  async function handleCreateRoom(){
    state.error = null; state.busy = true; render();
    try{
      let code = genCode();
      let existing = await loadRoom(code);
      let attempts = 0;
      while(existing && attempts < 5){
        code = genCode();
        existing = await loadRoom(code);
        attempts++;
      }
      const room = {
        code,
        imageUrl: state.selectedImage.url,
        rows: state.selectedSize.rows,
        cols: state.selectedSize.cols,
        players: [],
        status: 'lobby',
        createdAt: Date.now(),
      };
      const result = await window.storage.set(roomKey(code), JSON.stringify(room), true);
      if(!result){
        throw new Error('storage returned no result');
      }
      state.room = room;
      state.roomCode = code;
      state.busy = false;
      state.view = 'hostLobby';
      render();
      startPolling(pollAsHost, 2500);
    }catch(e){
      state.busy = false;
      state.error = 'Could not create the room. Check your connection and try again.';
      render();
    }
  }

  async function pollAsHost(){
    if(!state.roomCode) return;
    const fresh = await loadRoom(state.roomCode);
    if(fresh){
      state.room = fresh;
      if(state.view === 'hostLobby' || state.view === 'hostGame'){
        state.view = fresh.status === 'started' ? 'hostGame' : 'hostLobby';
        render();
      }
    }
  }

  async function handleStartGame(){
    if(!state.room || state.room.players.length === 0) return;
    state.busy = true;
    try{
      const fresh = await loadRoom(state.roomCode) || state.room;
      fresh.status = 'started';
      await saveRoom(fresh);
      state.room = fresh;
      state.busy = false;
      state.view = 'hostGame';
      render();
    }catch(e){
      state.busy = false;
      state.error = 'Could not start the game. Try again.';
      render();
    }
  }

  async function handleNewRound(){
    state.view = 'hostSetup';
    state.error = null;
    stopPolling();
    render();
  }

  async function handleJoinRoom(){
    state.error = null;
    const code = (state.joinCodeInput || '').trim().toUpperCase();
    const name = (state.joinNameInput || '').trim();
    if(code.length < 4){ state.error = 'Enter the 4-character room code.'; render(); return; }
    if(!name){ state.error = 'Enter your name so others can see it.'; render(); return; }

    state.busy = true; render();
    try{
      const room = await loadRoom(code);
      if(!room){
        state.busy = false;
        state.error = `No room found for code ${code}. Double check with the host.`;
        render();
        return;
      }
      const total = room.rows * room.cols;
      if(room.players.length >= total){
        state.busy = false;
        state.error = 'This room is full — every piece is already claimed.';
        render();
        return;
      }
      if(room.status === 'started'){
        state.busy = false;
        state.error = 'This game already started. Ask the host for a new room.';
        render();
        return;
      }
      const playerId = 'p_' + Math.random().toString(36).slice(2,10);
      const pieceIndex = room.players.length;
      room.players.push({ id: playerId, name, pieceIndex });
      await saveRoom(room);

      state.room = room;
      state.roomCode = code;
      state.playerId = playerId;
      state.playerName = name;
      state.busy = false;
      state.view = 'waiting';
      render();
      startPolling(pollAsPlayer, 2000);
    }catch(e){
      state.busy = false;
      state.error = 'Could not join the room. Check your connection and try again.';
      render();
    }
  }

  async function pollAsPlayer(){
    if(!state.roomCode) return;
    const fresh = await loadRoom(state.roomCode);
    if(fresh){
      state.room = fresh;
      if(fresh.status === 'started' && state.view === 'waiting'){
        state.view = 'playing';
        stopPolling();
      }
      render();
    }
  }

  render();
})();
</script>
</body>
</html>
